---
# Vérifications MC11 : ansible-playbook playbooks/verif_trackr.yml
# Connexion AD (membre de GG_Exploitation oui, les autres non), kill -9 → TrackR revient seul,
# une sauvegarde se restaure sur une base de test.
- name: TrackR survit à un kill -9, sa sauvegarde se restaure
  hosts: db_servers
  gather_facts: false
  become: true
  vars_files:
    - ../vault/secrets.yml
  vars:
    url: http://127.0.0.1:{{ trackr_port | default(8080) }}
  tasks:
    - name: Santé (base joignable, mode de connexion)
      ansible.builtin.uri:
        url: "{{ url }}/health"
      register: sante_avant

    # Connexion réussie : redirection vers / avec un cookie de session. Refusée : 401
    - name: Connexion AD de paul.durand (GG_Exploitation) et d'alice.martin (compta)
      ansible.builtin.uri:
        url: "{{ url }}/login"
        method: POST
        body_format: form-urlencoded
        body:
          user: "{{ item }}"
          password: "{{ vault_pwd_init }}"
        follow_redirects: none
        status_code: [303, 302, 401]
      loop: [paul.durand, alice.martin]
      register: connexions
      no_log: true

    - name: PID avant
      ansible.builtin.systemd_service:
        name: trackr
      register: avant

    - name: Tuer TrackR (kill -9)
      ansible.builtin.command: kill -9 {{ avant.status.MainPID }}
      changed_when: true

    # RestartSec=5 : TrackR doit répondre de nouveau en quelques secondes
    - name: TrackR répond de nouveau
      ansible.builtin.uri:
        url: "{{ url }}/health"
      register: sante
      until: sante.status == 200
      retries: 15
      delay: 1

    - name: PID après
      ansible.builtin.systemd_service:
        name: trackr
      register: apres

    - name: Sauvegarde maintenant (le même service que le timer)
      ansible.builtin.systemd_service:
        name: pg-backup.service
        state: started

    - name: Restaurer la dernière sauvegarde dans trackr_test et compter
      ansible.builtin.shell: |
        set -euo pipefail
        f=$(ls -t /var/backups/pg/trackr-*.dump | head -1)
        dropdb --if-exists trackr_test
        createdb trackr_test
        pg_restore --no-owner -d trackr_test "$f"
        echo "$f"
        psql -Atc 'SELECT count(*) FROM expeditions' trackr
        psql -Atc 'SELECT count(*) FROM expeditions' trackr_test
      args:
        executable: /bin/bash
      become: true
      become_user: postgres
      register: restau
      changed_when: true

    - name: Prochaine sauvegarde, score de durcissement
      ansible.builtin.shell: |  # noqa: command-instead-of-module
        set -o pipefail
        systemctl list-timers pg-backup.timer --no-pager | head -2
        systemd-analyze security trackr --no-pager | tail -1
      args:
        executable: /bin/bash
      register: infos
      changed_when: false

    - name: Résultat
      ansible.builtin.assert:
        that:
          - sante_avant.json.auth == 'ad'
          - connexions.results[0].status in [302, 303]
          - connexions.results[1].status == 401
          - apres.status.MainPID != avant.status.MainPID
          - restau.stdout_lines[1] == restau.stdout_lines[2]
        success_msg: >-
          connexion AD : paul.durand {{ connexions.results[0].status }},
          alice.martin {{ connexions.results[1].status }} ;
          kill -9 : PID {{ avant.status.MainPID }} → {{ apres.status.MainPID }} ;
          restauré {{ restau.stdout_lines[0] | basename }} :
          {{ restau.stdout_lines[2] }} expédition(s) sur {{ restau.stdout_lines[1] }} ;
          {{ infos.stdout_lines | join(' | ') }}
