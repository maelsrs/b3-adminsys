---
# MC14 : l'état des mises à jour de tout le parc, pour l'assureur. Ne modifie rien.
#   ansible-playbook playbooks/rapport_maj.yml   →   rapports/maj-AAAA-MM-JJ.html
# Une machine injoignable n'est pas cachée : elle apparaît comme telle dans le rapport.
- name: Relever l'état des mises à jour, machine par machine
  hosts: all
  gather_facts: false
  ignore_unreachable: true
  vars_files:
    - ../vault/secrets.yml
  tasks:
    - name: Système
      ansible.builtin.setup:
        gather_subset: [min]

    - name: Debian, l'état (liste des paquets rafraîchie, simulation, traces d'apt)
      when: ansible_facts.os_family | default('') == 'Debian'
      become: true
      ansible.builtin.shell: |
        set -o pipefail
        apt-get update -qq
        sim=$(apt-get -s dist-upgrade | grep '^Inst' || true)
        total=$(printf '%s' "$sim" | grep -c . || true)
        secu=$(printf '%s' "$sim" | grep -c -- '-security' || true)
        reboot=$([ -f /var/run/reboot-required ] && echo true || echo false)
        # Dernière vraie mise à jour : un bloc « Upgrade: » de l’historique apt (campagne, unattended)
        last=$(zcat -f /var/log/apt/history.log* 2>/dev/null |
          awk '/^Start-Date/ {u = 0} /^Upgrade:/ {u = 1} /^End-Date/ && u {print $2}' | sort | tail -1)
        auto=$(apt-config dump | grep -q 'APT::Periodic::Unattended-Upgrade "1"' && echo true || echo false)
        printf '{"en_attente": %s, "securite": %s, "redemarrage": %s, "derniere_maj": "%s", "auto": %s}\n' \
          "$total" "$secu" "$reboot" "$last" "$auto"
      args:
        executable: /bin/bash
      register: maj_debian
      changed_when: false

    - name: Alpine (routeurs), l'état
      when: ansible_facts.os_family | default('') == 'Alpine'
      become: true
      ansible.builtin.shell: |
        set -o pipefail
        apk update -q >/dev/null
        total=$(apk version -l '<' | tail -n +2 | grep -c . || true)
        printf '{"en_attente": %s, "securite": null, "redemarrage": false, ' "$total"
        printf '"derniere_maj": "", "auto": false}\n'
      args:
        executable: /bin/bash
      register: maj_alpine
      changed_when: false

    # state: searched : la liste, sans rien installer. Les mêmes catégories que la campagne
    - name: Windows, les mises à jour importantes en attente
      when: ansible_facts.os_family | default('') == 'Windows'
      ansible.windows.win_updates:
        category_names: [SecurityUpdates, CriticalUpdates, UpdateRollups]
        state: searched
      register: maj_windows

    - name: Windows, dernière mise à jour installée
      when: ansible_facts.os_family | default('') == 'Windows'
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $d = Get-HotFix | Where-Object InstalledOn | Sort-Object InstalledOn -Descending | Select-Object -First 1
          if ($d) { $d.InstalledOn.ToString('yyyy-MM-dd') } else { '' }
          # Stratégie posée par le rôle maj_auto : 3 = téléchargement automatique, installation manuelle
          $au = Get-ItemProperty HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU `
            -ErrorAction SilentlyContinue
          [int]$au.AUOptions
      register: maj_windows_date

    - name: Une ligne du rapport
      ansible.builtin.set_fact:
        rapport_maj: >-
          {{ (maj_debian.stdout | from_json) if maj_debian.stdout is defined
             else (maj_alpine.stdout | from_json) if maj_alpine.stdout is defined
             else {'en_attente': maj_windows.found_update_count,
                   'securite': maj_windows.updates.values()
                               | selectattr('categories', 'contains', 'Security Updates') | list | length,
                   'redemarrage': maj_windows.reboot_required,
                   'derniere_maj': maj_windows_date.output[0],
                   'auto': 'telechargement' if maj_windows_date.output[1] == 3 else false} }}
      when: maj_debian.stdout is defined or maj_alpine.stdout is defined or maj_windows.found_update_count is defined

- name: Écrire le rapport
  hosts: localhost
  gather_facts: false
  vars:
    rapport_date: "{{ now(fmt='%Y-%m-%d') }}"
    rapport_heure: "{{ now(fmt='%H:%M') }}"
    # Pour un lecteur qui n'est pas informaticien : à quoi sert chaque machine
    rapport_roles:
      win02: Annuaire des comptes, Lille (contrôleur de domaine principal)
      win01: Annuaire des comptes, Dunkerque (contrôleur de domaine)
      srv01: Partages de fichiers des services, Lille
      db01: Base de données et application TrackR, Dunkerque
      deb01: Serveur Linux d'administration, Lille
      ldap01: Annuaire des prestataires, Lille
      rtr-a: Routeur et liaison sécurisée, Lille
      rtr-b: Routeur et liaison sécurisée, Dunkerque
      openvpn: Accès à distance des informaticiens (VPN), Lille
  tasks:
    - name: Rapport HTML daté
      ansible.builtin.template:
        src: rapport_maj.html.j2
        dest: "{{ playbook_dir }}/../rapports/maj-{{ rapport_date }}.html"
        mode: "0644"

    - name: Où le trouver
      ansible.builtin.debug:
        msg: "rapports/maj-{{ rapport_date }}.html"
