---
- name: OU racine
  microsoft.ad.ou:
    name: "{{ ad_ou_root }}"
    path: "{{ ad_base }}"

- name: OU transverses et OU de site
  microsoft.ad.ou:
    name: "{{ item }}"
    path: "OU={{ ad_ou_root }},{{ ad_base }}"
  loop: "{{ ad_ous + ad_sites | map(attribute='name') | list }}"

- name: OU de service dans chaque site
  microsoft.ad.ou:
    name: "{{ item.1 }}"
    path: "OU={{ item.0 }},OU={{ ad_ou_root }},{{ ad_base }}"
  loop: "{{ ad_sites | map(attribute='name') | product(ad_site_ous) | list }}"
  loop_control:
    label: "{{ item.0 }}/{{ item.1 }}"

# Les GG doivent exister avant les DL qui les contiennent : l'ordre de ad_groups compte
- name: Groupes (AGDLP)
  microsoft.ad.group:
    name: "{{ item.name }}"
    scope: "{{ item.scope }}"
    path: "OU=Groupes,OU={{ ad_ou_root }},{{ ad_base }}"
    members:
      add: "{{ item.members | default([]) }}"
  loop: "{{ ad_groups }}"
  loop_control:
    label: "{{ item.name }}"

# MC13 : arrivée, mutation, départ, depuis personnel.yml (ad_users est calculé, regles.yml).
# Le mot de passe initial n'est à changer qu'à la création : sur un compte existant, le forcer
# à chaque passage obligerait tout le monde à en changer.
- name: Comptes AD existants
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      @(Get-ADUser -Filter * | ForEach-Object SamAccountName)
  register: ad_existants
  check_mode: false

# identity (sAMAccountName) : retrouvé où qu'il soit, puis déplacé vers `path` (mutation, départ)
- name: Salariés (arrivée, mutation, départ)
  microsoft.ad.user:
    identity: "{{ item.name }}"
    name: "{{ item.name }}"
    sam_account_name: "{{ item.name }}"
    upn: "{{ item.name }}@{{ ad_domain }}"
    firstname: "{{ item.firstname }}"
    surname: "{{ item.surname }}"
    # OU calculée : celle du site, OU=Admins (adm-xxx) ou OU=Départs
    path: "{{ item.ou }},OU={{ ad_ou_root }},{{ ad_base }}"
    enabled: "{{ item.enabled }}"
    password: "{{ vault_pwd_init }}"
    update_password: on_create
    password_expired: "{{ true if item.name not in ad_existants.output else omit }}"
    # Domain Users est le groupe principal : AD refuse de le retirer, set doit l'inclure
    groups:
      set: "{{ item.groups + ['Domain Users'] }}"
  loop: "{{ ad_users }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
