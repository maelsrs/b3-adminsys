- name: Rôle DHCP
  ansible.windows.win_feature:
    name: DHCP
    include_management_tools: true

- name: Autoriser le serveur DHCP dans AD
  ansible.windows.win_powershell:
    parameters:
      Domain: "{{ ad_domain }}"
    script: |
      param([string]$Domain)
      $Ansible.Changed = $false
      $fqdn = "$env:COMPUTERNAME.$Domain"
      if (-not (Get-DhcpServerInDC | Where-Object DnsName -eq $fqdn)) {
        Add-DhcpServerInDC -DnsName $fqdn
        $Ansible.Changed = $true
      }

# Chaque DC sert l'étendue de son site : Dunkerque distribue ses adresses tunnel coupé.
# DNS distribués : le DC du site d'abord, les autres en secours.
- name: Étendue DHCP du site et ses options
  vars:
    scope: "{{ ad_sites | selectattr('name', 'equalto', ad_site) | first }}"
    other_dcs: "{{ groups['domain_controllers'] | difference([inventory_hostname]) }}"
  ansible.windows.win_powershell:
    parameters:
      Name: "{{ scope.name }}"
      ScopeId: "{{ scope.subnet | split('/') | first }}"
      Start: "{{ scope.dhcp.start }}"
      End: "{{ scope.dhcp.end }}"
      Mask: "{{ scope.dhcp.mask }}"
      Router: "{{ scope.dhcp.router }}"
      Dns: "{{ [ad_dc_ip] + other_dcs | map('extract', hostvars, ['baseline_win_lan', 'address']) | list }}"
      Domain: "{{ ad_domain }}"
    script: |
      param($Name, $ScopeId, $Start, $End, $Mask, $Router, [string[]]$Dns, $Domain)
      $Ansible.Changed = $false
      if (-not (Get-DhcpServerv4Scope | Where-Object { $_.ScopeId.IPAddressToString -eq $ScopeId })) {
        Add-DhcpServerv4Scope -Name $Name -StartRange $Start -EndRange $End -SubnetMask $Mask -State Active
        $Ansible.Changed = $true
      }
      # 3 = passerelle, 6 = DNS, 15 = suffixe DNS
      $options = @{ 3 = @($Router); 6 = $Dns; 15 = @($Domain) }
      foreach ($id in $options.Keys) {
        $current = (Get-DhcpServerv4OptionValue -ScopeId $ScopeId -OptionId $id -ErrorAction SilentlyContinue).Value
        if ((@($current) -join ',') -ne ($options[$id] -join ',')) {
          Set-DhcpServerv4OptionValue -ScopeId $ScopeId -OptionId $id -Value $options[$id]
          $Ansible.Changed = $true
        }
      }
