- name: Rôle AD DS
  ansible.windows.win_feature:
    name: AD-Domain-Services
    include_management_tools: true

# Le site doit déjà exister (sites.yml sur la racine) : le DC y naît directement
- name: Promouvoir le DC dans son site
  microsoft.ad.domain_controller:
    dns_domain_name: "{{ ad_domain }}"
    domain_admin_user: "{{ ad_admin }}"
    domain_admin_password: "{{ ad_admin_password }}"
    safe_mode_password: "{{ vault_dsrm }}"
    site_name: "{{ ad_site }}"
    install_dns: true
    state: domain_controller
    reboot: true

- name: Attendre que l'AD soit prêt
  ansible.windows.win_powershell:
    script: Get-ADDomain -Server localhost -ErrorAction Stop
  register: ad_ready
  until: ad_ready is succeeded
  retries: 30
  delay: 10
  changed_when: false
