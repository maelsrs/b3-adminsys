---
- name: Recharger Prometheus
  ansible.builtin.service:
    name: prometheus
    state: restarted

- name: Recharger Alertmanager
  ansible.builtin.service:
    name: prometheus-alertmanager
    state: restarted

- name: Recharger blackbox
  ansible.builtin.systemd_service:
    name: prometheus-blackbox-exporter
    state: restarted
    daemon_reload: true

- name: Relancer rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: restarted

- name: Relancer le récepteur d'alertes
  ansible.builtin.systemd_service:
    name: alertes
    state: restarted
    daemon_reload: true
