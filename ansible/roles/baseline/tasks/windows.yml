- name: Définir le nom d'hôte
  ansible.windows.win_hostname:
    name: "{{ inventory_hostname }}"
  register: baseline_win_hostname

- name: Redémarrer pour appliquer le nom d'hôte
  ansible.windows.win_reboot:
  when: baseline_win_hostname.reboot_required

- name: Définir le fuseau horaire
  ansible.windows.win_timezone:
    timezone: "{{ baseline_win_timezone }}"

- name: Configurer les serveurs NTP
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\Parameters
    name: NtpServer
    data: "{{ baseline_ntp_servers | map('regex_replace', '$', ',0x8') | join(' ') }}"
    type: string
  notify: Redémarrer w32time

- name: Synchroniser sur les serveurs NTP manuels
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\Parameters
    name: Type
    data: NTP
    type: string
  notify: Redémarrer w32time

- name: Démarrer le service de temps
  ansible.windows.win_service:
    name: W32Time
    start_mode: auto
    state: started

- name: Créer le compte admin
  ansible.windows.win_user:
    name: "{{ baseline_admin_user }}"
    password: "{{ baseline_admin_password }}"
    password_never_expires: true
    groups:
      - "{{ baseline_win_admin_group }}"
    groups_action: add
  no_log: true

# IP fixe sur la carte LAN, retrouvée par son adresse MAC. Pas de passerelle par défaut :
# Internet et Ansible passent par la carte de gestion, les sites par une route 10.1.0.0/16.
- name: IP fixe sur le LAN
  ansible.windows.win_powershell:
    parameters:
      Mac: "{{ baseline_win_lan.mac }}"
      Address: "{{ baseline_win_lan.address }}"
      Prefix: "{{ baseline_win_lan.prefix }}"
      Gateway: "{{ baseline_win_lan.gateway }}"
    script: |
      param($Mac, $Address, [int]$Prefix, $Gateway)
      $Ansible.Changed = $false
      $nic = Get-NetAdapter | Where-Object MacAddress -eq $Mac
      if ($nic.Name -ne 'LAN') {
        Rename-NetAdapter -Name $nic.Name -NewName LAN
        $Ansible.Changed = $true
      }
      $ip = Get-NetIPAddress -InterfaceAlias LAN -AddressFamily IPv4 -ErrorAction SilentlyContinue
      if (-not ($ip | Where-Object { $_.IPAddress -eq $Address -and $_.PrefixLength -eq $Prefix })) {
        Set-NetIPInterface -InterfaceAlias LAN -Dhcp Disabled
        $ip | Remove-NetIPAddress -Confirm:$false -ErrorAction SilentlyContinue
        New-NetIPAddress -InterfaceAlias LAN -IPAddress $Address -PrefixLength $Prefix | Out-Null
        $Ansible.Changed = $true
      }
      if (-not (Get-NetRoute -DestinationPrefix 10.1.0.0/16 -NextHop $Gateway -ErrorAction SilentlyContinue)) {
        New-NetRoute -InterfaceAlias LAN -DestinationPrefix 10.1.0.0/16 -NextHop $Gateway | Out-Null
        $Ansible.Changed = $true
      }
      # Le DC ne doit publier dans le DNS que son IP LAN
      Get-NetAdapter | Where-Object Name -ne LAN | ForEach-Object {
        if ((Get-DnsClient -InterfaceIndex $_.ifIndex).RegisterThisConnectionsAddress) {
          Set-DnsClient -InterfaceIndex $_.ifIndex -RegisterThisConnectionsAddress $false
          $Ansible.Changed = $true
        }
      }
  when: baseline_win_lan is defined
