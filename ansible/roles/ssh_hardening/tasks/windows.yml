- name: Installer OpenSSH Server
  ansible.windows.win_powershell:
    script: |
      $cap = Get-WindowsCapability -Online -Name OpenSSH.Server*
      if ($cap.State -ne 'Installed') {
        Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
        $Ansible.Changed = $true
      }

- name: Démarrer sshd et l'activer au démarrage
  ansible.windows.win_service:
    name: sshd
    start_mode: auto
    state: started

- name: Créer le dossier ProgramData\ssh
  ansible.windows.win_file:
    path: C:\ProgramData\ssh
    state: directory

- name: Déposer la clé publique admin
  ansible.windows.win_copy:
    content: "{{ baseline_admin_ssh_key }}\n"
    dest: C:\ProgramData\ssh\administrators_authorized_keys
  no_log: true

- name: Restreindre les permissions du fichier de clés
  ansible.windows.win_shell: |
    icacls "C:\ProgramData\ssh\administrators_authorized_keys" /inheritance:r `
      /grant "SYSTEM:(F)" /grant "Administrators:(F)"
  changed_when: false

- name: Règle pare-feu SSH
  community.windows.win_firewall_rule:
    name: OpenSSH Server (sshd)
    localport: 22
    action: allow
    direction: in
    protocol: tcp
    state: present
    enabled: true
