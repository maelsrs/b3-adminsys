---
- name: Valider sshd
  ansible.builtin.command: sshd -t
  listen: Recharger sshd
  changed_when: false

# Debian : ssh ; Alpine (routeurs) : sshd
- name: Recharger sshd
  ansible.builtin.service:
    name: "{{ 'sshd' if ansible_facts.os_family == 'Alpine' else 'ssh' }}"
    state: reloaded
  listen: Recharger sshd
