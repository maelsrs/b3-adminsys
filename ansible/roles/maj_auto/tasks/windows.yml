---
# Par défaut, Windows peut installer seul puis redémarrer à l'heure qu'il choisit : un DC qui
# redémarre un mardi à 10 h. Stratégie locale (les DC ne sont pas dans nos OU, une GPO de
# serveurs ne les toucherait pas) : AUOptions 3 = télécharger seul, installer par la campagne.
- name: Windows Update télécharge, n'installe pas, ne redémarre jamais seul
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    type: dword
  loop:
    - {name: NoAutoUpdate, data: 0}
    - {name: AUOptions, data: 3}
    - {name: NoAutoRebootWithLoggedOnUsers, data: 1}
  loop_control:
    label: "{{ item.name }} = {{ item.data }}"
