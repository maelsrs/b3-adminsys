---
# MC11 : TrackR (files/trackr = trackr.py du prestataire, inchangé) en service systemd durci,
# base sauvegardée toutes les heures par un timer. TrackR tourne à côté de sa base, sur db01
# (Dunkerque) : la base ne dépend pas du lien inter-sites, et la connexion passe d'abord par
# le DC de Dunkerque.
# python3-psycopg2 : PostgreSQL ; python3-ldap3 : connexion AD ; acl : become_user postgres
- name: Paquets
  ansible.builtin.apt:
    name: [python3-psycopg2, python3-ldap3, acl]
    state: present

# TrackR trouve les DC par leur nom (certificats LDAPS à ce nom)
- name: DNS de l'AD
  ansible.builtin.include_role:
    name: ad_member
    tasks_from: dns

# Journaux conservés au redémarrage : sans ça, l'historique d'un plantage disparaît avec lui
- name: Dossier des réglages journald
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Journaux persistants (journald)
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/persistent.conf
    content: |
      # Géré par Ansible (rôle trackr)
      [Journal]
      Storage=persistent
    mode: "0644"
  notify: Relancer journald

- name: Compte système trackr, sans shell ni dossier personnel
  ansible.builtin.user:
    name: trackr
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/trackr
    create_home: false

# Authentification « peer » par socket Unix : le compte système trackr = le rôle trackr
- name: Rôle PostgreSQL trackr
  community.postgresql.postgresql_user:
    name: trackr
  become: true
  become_user: postgres

- name: Base trackr
  community.postgresql.postgresql_db:
    name: "{{ trackr_db }}"
    owner: trackr
  become: true
  become_user: postgres

- name: Programme TrackR
  ansible.builtin.copy:
    src: trackr
    dest: /opt/trackr/
    mode: "0755"
  notify: Relancer TrackR

- name: Dossier de configuration
  ansible.builtin.file:
    path: /etc/trackr
    state: directory
    mode: "0755"

# Le certificat de chaque DC, lu par WinRM (canal authentifié) plutôt que sur le port 636
- name: Certificats LDAPS des DC
  ansible.windows.win_powershell:
    parameters:
      Fqdn: "{{ item }}.{{ ad_domain }}"
    script: |
      param($Fqdn)
      $Ansible.Changed = $false
      $c = Get-ChildItem Cert:\LocalMachine\My | Where-Object { $_.Subject -eq "CN=$Fqdn" -and $_.HasPrivateKey } |
        Sort-Object NotAfter -Descending | Select-Object -First 1
      if (-not $c) { throw "Pas de certificat LDAPS sur $Fqdn : rôle ad_dc, --tags ldaps" }
      $b64 = [Convert]::ToBase64String($c.RawData, 'InsertLineBreaks') -replace "`r", ''
      "-----BEGIN CERTIFICATE-----`n$b64`n-----END CERTIFICATE-----"
  delegate_to: "{{ item }}"
  loop: "{{ groups['domain_controllers'] }}"
  register: trackr_dc_certs
  check_mode: false

- name: Certificats des DC, pour vérifier qu'on parle bien à eux
  ansible.builtin.copy:
    dest: /etc/trackr/ad-ca.crt
    content: |
      {% for r in trackr_dc_certs.results %}
      # {{ r.item }}
      {{ r.output[0] }}
      {% endfor %}
    mode: "0644"
  notify: Relancer TrackR

# Le secret de session est dedans : lisible par root et le groupe trackr seulement
- name: Configuration TrackR
  ansible.builtin.template:
    src: trackr.env.j2
    dest: /etc/trackr/trackr.env
    owner: root
    group: trackr
    mode: "0640"
  diff: false
  notify: Relancer TrackR

- name: Unité trackr.service
  ansible.builtin.template:
    src: trackr.service.j2
    dest: /etc/systemd/system/trackr.service
    mode: "0644"
  notify: Relancer TrackR

- name: TrackR démarré et lancé au boot
  ansible.builtin.systemd_service:
    name: trackr
    state: started
    enabled: true
    daemon_reload: true

# Sauvegarde : le timer dit quand, le service dit quoi
- name: Dossier des sauvegardes
  ansible.builtin.file:
    path: "{{ trackr_backup_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Script de sauvegarde
  ansible.builtin.copy:
    src: pg-backup
    dest: /usr/local/bin/pg-backup
    mode: "0755"

- name: Unités de sauvegarde
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop: [pg-backup.service, pg-backup.timer]
  register: trackr_backup_units

- name: Timer de sauvegarde actif
  ansible.builtin.systemd_service:
    name: pg-backup.timer
    state: started
    enabled: true
    daemon_reload: "{{ trackr_backup_units is changed }}"
