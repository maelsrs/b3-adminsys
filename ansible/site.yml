- name: Baseline commune Linux et Windows
  hosts: all
  vars_files:
    - vault/secrets.yml
  roles:
    - baseline

- name: Durcissement SSH (Linux + Windows)
  hosts: linux,windows
  vars_files:
    - vault/secrets.yml
  roles:
    - ssh_hardening

- name: Routeurs (IP, routage, pare-feu, tunnel, OSPF)
  hosts: routers
  vars_files:
    - vault/secrets.yml
    - vault/wireguard.yml
  roles:
    - router
    - wireguard
    - frr

- name: Mise en place de l'AD
  hosts: domain_controllers
  vars_files:
    - vault/secrets.yml
  roles:
    - ad_dc
