- name: Baseline commune Linux et Windows
  hosts: all
  vars_files:
    - vault/secrets.yml
  roles:
    - baseline

- name: Durcissement SSH (Linux + Windows)
  hosts: linux,windows
  vars_files:
    - vault/secrets.yml
  roles:
    - ssh_hardening

- name: Routeurs (IP, routage, pare-feu, tunnel, OSPF)
  hosts: routers
  vars_files:
    - vault/secrets.yml
    - vault/wireguard.yml
  roles:
    - router
    - wireguard
    - frr

- name: Mise en place de l'AD
  hosts: domain_controllers
  vars_files:
    - vault/secrets.yml
  roles:
    - ad_dc

# Après les DC : le domaine doit exister pour le joindre
- name: Debian membres du domaine (realmd, SSSD, sudo)
  hosts: ad_members
  vars_files:
    - vault/secrets.yml
  roles:
    - ad_member

# Après les DC (enregistrement DNS ldap01) et les membres (clients du certificat)
- name: Annuaire OpenLDAP des prestataires
  hosts: ldap_servers
  vars_files:
    - vault/secrets.yml
  roles:
    - openldap
