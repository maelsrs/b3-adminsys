---
all:
  children:
    site_a:
      hosts:
        # Debian et Windows : joints par leur IP LAN fixe via le VPN (les IP de gestion DHCP bougent)
        deb01:
          ansible_host: 10.1.10.20
        rtr-a:
          ansible_host: 192.168.0.40
        # DC : joints par leur IP LAN, à travers le VPN (OpenVPN pousse 10.1.0.0/16). Plus de
        # carte de gestion, sinon ils se parlent par elle au lieu du tunnel (README, MC05)
        win02:
          ansible_host: 10.1.10.10
        # Serveur membre Windows (MC08) : VM 120, clone lié de template-windows
        srv01:
          ansible_host: 10.1.10.30
        openvpn:
          ansible_host: 10.1.10.23
        # Annuaire des prestataires (MC07) : VM 119, clone lié de template-debian
        ldap01:
          ansible_host: 10.1.10.21
        # Supervision et journaux (MC15) : VM 122
        mon01:
          ansible_host: 10.1.10.22
    site_b:
      hosts:
        win01:
          ansible_host: 10.1.20.30
        rtr-b:
          ansible_host: 192.168.0.49
        # PostgreSQL de TrackR (MC09) : VM 121, clone lié, 2 disques de données en RAID 1
        db01:
          ansible_host: 10.1.20.21
    linux:
      hosts:
        deb01:
        rtr-a:
        rtr-b:
        openvpn:
        ldap01:
        db01:
        mon01:
    windows:
      hosts:
        win01:
        win02:
        srv01:
    # Le premier de la liste porte la forêt (ad_forest_root), les autres la rejoignent
    domain_controllers:
      hosts:
        win02:
        win01:
    # Debian membres du domaine (MC06) : realmd, SSSD, sudo par groupe AD
    ad_members:
      hosts:
        deb01:
    # Windows membres du domaine (MC08) : jonction, partages
    win_members:
      hosts:
        srv01:
    # OpenLDAP des prestataires (MC07), hors du domaine AD
    ldap_servers:
      hosts:
        ldap01:
    # Stockage RAID 1 + LVM (MC09)
    db_servers:
      hosts:
        db01:
    # Prometheus, Alertmanager, journaux centralisés (MC15)
    monitoring:
      hosts:
        mon01:
    routers:
      hosts:
        rtr-a:
        rtr-b:
