ad_domain:  loginord.internal
ad_netbios: LOGINORD
ad_base:  "DC=loginord,DC=internal"

# Le DC qui crée la forêt (et porte les objets de l'annuaire) ; les autres DC la rejoignent
ad_forest_root: "{{ groups['domain_controllers'] | first }}"
# Administrateur du domaine : l'Administrator local de la racine devenu compte de domaine,
# il a gardé son mot de passe
ad_admin: "Administrator@{{ ad_domain }}"
ad_admin_password: "{{ vault_win_password }}"

# IP LAN du DC (celle qu'il publie dans le DNS)
ad_dc_ip: "{{ baseline_win_lan.address }}"
# DNS client d'un DC : la racine d'abord, puis lui-même (voir README, MC05)
ad_dns_client: "{{ [hostvars[ad_forest_root].baseline_win_lan.address, ad_dc_ip] | unique }}"

# Sites AD : un site = un sous-réseau, son étendue DHCP servie par le DC du site.
# Un 3e site = une entrée de plus (et ad_site dans le group_vars du site).
# Le premier site reprend Default-First-Site-Name.
ad_sites:
  - name: Lille
    subnet: 10.1.10.0/24
    dhcp: {start: 10.1.10.100, end: 10.1.10.200, mask: 255.255.255.0, router: 10.1.10.1}
  - name: Dunkerque
    subnet: 10.1.20.0/24
    dhcp: {start: 10.1.20.100, end: 10.1.20.200, mask: 255.255.255.0, router: 10.1.20.1}
# Un seul lien qui relie tous les sites ; 180 min par défaut, 15 au minimum
ad_site_link:
  name: Lille-Dunkerque
  cost: 100
  frequency: 15
  # Bonus MC05 : notification de changement, réplication quasi immédiate entre sites
  notification: true

# Arborescence : OU racine, OU transverses, puis sites × services
ad_ou_root: LogiNord
ad_ous: [Groupes, Admins, Départs]
ad_site_ous: [Utilisateurs, Serveurs]

ad_groups:
  - name: GG_Compta
    scope: global
  - name: GG_Direction
    scope: global
  - name: GG_Adminsys
    scope: global
  - name: DL_Partage_Adminsys_RW
    scope: domainlocal
    members: [GG_Adminsys]
  - name: DL_Partage_Direction_RW
    scope: domainlocal
    members: [GG_Direction]
  - name: DL_Partage_Compta_RW
    scope: domainlocal
    members: [GG_Compta]

ad_users:
  - name: test2.test2
    firstname: Test2
    surname: Test2
    site: Lille
    groups: [GG_Adminsys]
  - name: test.test
    firstname: Test
    surname: Test
    site: Dunkerque
    groups: [GG_Direction]
  - name: alice.martin
    firstname: Alice
    surname: Martin
    site: Lille
    groups: [GG_Compta]

# DNS : zones inverses (une par LAN), enregistrements A + PTR, redirecteurs
ad_dns_reverse_zones:
  - 10.1.10.in-addr.arpa
  - 20.1.10.in-addr.arpa
ad_dns_records:
  - name: trackr
    ip: 10.1.20.20
ad_dns_forwarders: [1.1.1.1, 9.9.9.9]
