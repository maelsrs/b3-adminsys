---
# ad_domain, ad_base, ad_admin… : group_vars/all/ad.yml (partagés avec les membres Linux)

# Le DC qui crée la forêt (et porte les objets de l'annuaire) ; les autres DC la rejoignent
ad_forest_root: "{{ groups['domain_controllers'] | first }}"
# IP LAN du DC (celle qu'il publie dans le DNS)
ad_dc_ip: "{{ baseline_win_lan.address }}"
# DNS client d'un DC : la racine d'abord, puis lui-même (voir README, MC05)
ad_dns_client: "{{ [hostvars[ad_forest_root].baseline_win_lan.address, ad_dc_ip] | unique }}"

# Sites AD : un site = un sous-réseau, son étendue DHCP servie par le DC du site.
# Un 3e site = une entrée de plus (et ad_site dans le group_vars du site).
# Le premier site reprend Default-First-Site-Name.
ad_sites:
  - name: Lille
    subnet: 10.1.10.0/24
    dhcp: {start: 10.1.10.100, end: 10.1.10.200, mask: 255.255.255.0, router: 10.1.10.1}
  - name: Dunkerque
    subnet: 10.1.20.0/24
    dhcp: {start: 10.1.20.100, end: 10.1.20.200, mask: 255.255.255.0, router: 10.1.20.1}
# Un seul lien qui relie tous les sites ; 180 min par défaut, 15 au minimum
ad_site_link:
  name: Lille-Dunkerque
  cost: 100
  frequency: 15
  # Bonus MC05 : notification de changement, réplication quasi immédiate entre sites
  notification: true

# Arborescence : OU racine, OU transverses, puis sites × services
# Nouveaux : là où atterrissent les ordinateurs joints sans OU précise (redircmp, MC08)
ad_ous: [Groupes, Admins, Départs, Nouveaux]
ad_site_ous: [Utilisateurs, Serveurs]

ad_groups:
  - name: GG_Compta
    scope: global
  - name: GG_Direction
    scope: global
  - name: GG_Adminsys
    scope: global
  - name: GG_RH
    scope: global
  # MC06 : connexion aux Debian (+ sudo pour les admins)
  - name: GG_Admins_Linux
    scope: global
  - name: GG_Developpeurs
    scope: global
  # MC11 : les gens des quais, seuls à entrer dans TrackR (TRACKR_AD_GROUP)
  - name: GG_Exploitation
    scope: global
  # MC08 : les comptes d'administration adm-xxx, soumis à la PSO
  - name: GG_Admins_Domaine
    scope: global
  - name: DL_Partage_Adminsys_RW
    scope: domainlocal
    members: [GG_Adminsys]
  - name: DL_Partage_Direction_RW
    scope: domainlocal
    members: [GG_Direction]
  - name: DL_Partage_Compta_RW
    scope: domainlocal
    members: [GG_Compta]
  - name: DL_Partage_RH_RW
    scope: domainlocal
    members: [GG_RH]

ad_users:
  - name: test2.test2
    firstname: Test2
    surname: Test2
    site: Lille
    groups: [GG_Adminsys, GG_Admins_Linux]
  - name: test.test
    firstname: Test
    surname: Test
    site: Dunkerque
    groups: [GG_Direction]
  - name: alice.martin
    firstname: Alice
    surname: Martin
    site: Lille
    groups: [GG_Compta]
  - name: bob.leroy
    firstname: Bob
    surname: Leroy
    site: Dunkerque
    groups: [GG_Developpeurs]
  - name: paul.durand
    firstname: Paul
    surname: Durand
    site: Dunkerque
    groups: [GG_Exploitation]
  # Compte d'administration séparé du compte de tous les jours (test2.test2), dans OU=Admins
  - name: adm-test2
    firstname: Test2
    surname: Test2 (admin)
    ou: OU=Admins
    groups: [GG_Admins_Domaine]

# DNS : zones inverses (une par LAN), enregistrements A + PTR, redirecteurs
ad_dns_reverse_zones:
  - 10.1.10.in-addr.arpa
  - 20.1.10.in-addr.arpa
ad_dns_records:
  # TrackR tourne à côté de sa base (MC11) : un alias, pour pouvoir le déplacer sans toucher aux clients
  - name: trackr
    cname: db01
  # Hors domaine : ne s'inscrit pas seul comme deb01 (SSSD)
  - name: ldap01
    ip: 10.1.10.21
  - name: db01
    ip: 10.1.20.21
ad_dns_forwarders: [1.1.1.1, 9.9.9.9]

# MC08 : une seule politique de mots de passe par domaine, réglée sur le domaine lui-même
ad_password_policy:
  MinPasswordLength: 12
  LockoutThreshold: 5
  LockoutDuration: "00:15:00"
  LockoutObservationWindow: "00:15:00"

# MC08 bonus : stratégie affinée (PSO), plus dure pour les comptes d'administration.
# La seule exception à « une politique par domaine » ; Precedence : la plus petite gagne.
ad_pso:
  name: PSO-Admins
  applies_to: [GG_Admins_Domaine]
  settings:
    Precedence: 10
    MinPasswordLength: 16
    PasswordHistoryCount: 24
    ComplexityEnabled: true
    ReversibleEncryptionEnabled: false
    LockoutThreshold: 3
    LockoutDuration: "00:30:00"
    LockoutObservationWindow: "00:30:00"

# GPO de registre (Set-GPRegistryValue). Le nom est la clé : SRV = ordinateurs serveurs,
# USR = utilisateurs. Liées à l'OU `links` de chaque site. Chaque valeur (DWORD) est posée
# dans chacune des clés.
ad_gpo_registry:
  - name: SRV - Pare-feu
    links: Serveurs
    # Aussi les machines pas encore rangées (redircmp) : jamais sans pare-feu
    extra_links: [OU=Nouveaux]
    keys:
      - HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile
      - HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile
      - HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile
    values:
      EnableFirewall: 1
      DefaultInboundAction: 1   # bloquer l'entrant, sauf règles explicites
      DefaultOutboundAction: 0  # autoriser le sortant

# GPO importées depuis une sauvegarde du dépôt (files/gpo/<dossier>), pour ce que
# Set-GPRegistryValue ne sait pas faire : les préférences (lecteurs réseau)
ad_gpo_imports:
  - name: USR - Lecteurs réseau
    folder: USR-Lecteurs-reseau
    links: Utilisateurs
