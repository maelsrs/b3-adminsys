# Interface de gestion (Ansible) : jamais touchée par les rôles réseau
router_mgmt_if: eth0

# Les réseaux internes passent dans le vxlan de Proxmox (en-tête de 50 octets)
router_mtu: 1400

wg_listen_port: 51820
# 1400 (vxlan) - 80 (en-têtes WireGuard)
wg_mtu: 1320

# Tous les tunnels inter-sites : un nouveau site s'annonce sans toucher aux autres
ospf_tunnel_network: 10.255.0.0/16
wg_interface: wg0
