---
# Même suffixe que l'AD (dc=loginord,dc=internal), mais un autre serveur : deux annuaires
# distincts. Salariés dans AD, prestataires ici (README, MC07).
openldap_domain: loginord.internal
openldap_organization: LogiNord
openldap_admin_password: "{{ vault_ldap }}"

# Prestataires et groupes : calculés depuis personnel.yml (MC13, group_vars/all/regles.yml)

# Les machines qui doivent faire confiance au certificat autosigné
openldap_clients: "{{ groups['ad_members'] + groups['ldap_servers'] }}"
