---
# MC12 : chaque push est vérifié (lint), le déploiement part d'un clic, sur main seulement.
#   lint   → à chaque push et pull request (hors forks)
#   deploy → au clic, sur main
# Les deux sur notre runner auto-hébergé (label loginord), le portable qui voit les VM par le VPN
name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      limit:
        description: Hôtes visés (--limit), par défaut tout le parc
        default: "all"
      tags:
        description: Tags (--tags), vide = tout
        default: ""

permissions:
  contents: read

jobs:
  lint:
    # Sur notre runner, pas chez GitHub : le compte n'a pas de moyen de paiement, GitHub refuse
    # alors ses propres machines (même gratuites). Un runner auto-hébergé ne coûte rien.
    # Dépôt public : une pull request venue d'un fork ne s'exécute jamais sur le portable
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, loginord]
    defaults:
      run:
        working-directory: ansible
    env:
      # Outils et collections gardés d'un passage à l'autre, hors du dossier de travail
      LINT_HOME: ~/.cache/loginord-lint
    steps:
      - uses: actions/checkout@v4
      - name: Outils (venv et collections, réutilisés)
        run: |
          home=$(eval echo "$LINT_HOME")
          [ -x "$home/venv/bin/ansible-lint" ] || python3 -m venv "$home/venv"
          "$home/venv/bin/pip" install --quiet --upgrade ansible-core ansible-lint yamllint
          "$home/venv/bin/ansible-galaxy" collection install -r requirements.yml -p "$home/collections"
          echo "$home/venv/bin" >> "$GITHUB_PATH"
          echo "ANSIBLE_COLLECTIONS_PATH=$home/collections" >> "$GITHUB_ENV"
      # Le contrôle de syntaxe charge les vars_files : des fichiers vides suffisent, le lint n'a
      # jamais besoin du mot de passe du vault (checkout remet les vrais au passage suivant)
      - name: Vault remplacé par des fichiers vides
        run: |
          for f in vault/*.yml; do echo '--- {}' > "$f"; done
          echo inutile > "$RUNNER_TEMP/vault_pass"
          echo "ANSIBLE_VAULT_PASSWORD_FILE=$RUNNER_TEMP/vault_pass" >> "$GITHUB_ENV"
      - name: yamllint
        run: yamllint .
      - name: ansible-lint
        run: ansible-lint --offline

  deploy:
    # Seulement au clic (« Run workflow »), seulement sur main : un push ne déploie jamais
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: lint
    runs-on: [self-hosted, loginord]
    # L'environnement porte le secret VAULT_PASS (et peut exiger une validation avant de partir)
    environment: production
    # Un seul déploiement à la fois : deux playbooks sur les mêmes VM se marcheraient dessus
    concurrency:
      group: loginord
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      # GitHub n'a pas de secret « de type fichier » : on l'écrit, lisible par nous seuls,
      # et on l'efface quoi qu'il arrive. Le contenu est masqué (***) dans les journaux
      - name: Mot de passe du vault dans un fichier temporaire
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
        run: |
          umask 077
          printf '%s\n' "$VAULT_PASS" > "$RUNNER_TEMP/vault_pass"
          echo "ANSIBLE_VAULT_PASSWORD_FILE=$RUNNER_TEMP/vault_pass" >> "$GITHUB_ENV"
      # Exécuteur sur le portable : son Ansible, ses collections et sa clé SSH
      - name: ansible-playbook site.yml
        env:
          ANSIBLE_FORCE_COLOR: "true"
          LIMIT: ${{ inputs.limit }}
          TAGS: ${{ inputs.tags }}
        run: ansible-playbook site.yml --limit "$LIMIT" ${TAGS:+--tags "$TAGS"}
      - name: Effacer le mot de passe
        if: always()
        run: rm -f "$RUNNER_TEMP/vault_pass"
